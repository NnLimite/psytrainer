openapi: 3.1.0
info:
  title: PsyTrainer API
  version: 1.0.0
  description: Платформа тренировки навыков консультирования с ИИ-пациентами. Эндпоинты с x-status=implemented-in-module
    уже реализованы в модуле case_model, остальные спроектированы.
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: psytrainer.example
tags:
- name: Auth
  description: Аутентификация и доступ
- name: Profile
  description: Профиль, согласия, прогресс, право на удаление
- name: Organizations
  description: Организации, участники, приглашения, группы
- name: Reference
  description: Справочники
- name: Cases
  description: Конструктор кейсов и версии модели случая
- name: Sessions
  description: Сессии, диалог, состояние пациента
- name: Assessment
  description: Рубрики и оценка сессий
- name: Analytics
  description: Аналитика и отчёты
- name: Safety
  description: События безопасности
- name: Billing
  description: Подписки и платежи
- name: Admin
  description: Администрирование платформы
- name: System
  description: Служебные
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Регистрация (B2C)
      operationId: post_auth_register
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход по email и паролю
      operationId: post_auth_login
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновить access-токен по refresh-cookie
      operationId: post_auth_refresh
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выход, отзыв refresh-токена
      operationId: post_auth_logout
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '204':
          description: Без содержимого
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /auth/sso/{provider}/start:
    get:
      tags:
      - Auth
      summary: Начать вход через SSO вуза (OIDC)
      operationId: get_auth_sso_provider_start
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Перенаправление
          headers:
            Location:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/sso/{provider}/callback:
    get:
      tags:
      - Auth
      summary: Колбэк SSO, выдаёт сессию
      operationId: get_auth_sso_provider_callback
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        schema:
          type: string
        description: Код авторизации
      - name: state
        in: query
        schema:
          type: string
        description: Параметр state
      responses:
        '302':
          description: Перенаправление
          headers:
            Location:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Запросить письмо для сброса пароля
      operationId: post_auth_password_forgot
      description: 'Всегда отвечает 202, даже если email неизвестен (защита от перебора).


        Роли: public.'
      x-roles:
      - public
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotIn'
      responses:
        '202':
          description: Принято
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Установить новый пароль по токену из письма
      operationId: post_auth_password_reset
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetIn'
      responses:
        '204':
          description: Без содержимого
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /me:
    get:
      tags:
      - Profile
      summary: Текущий пользователь
      operationId: get_me
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
    patch:
      tags:
      - Profile
      summary: Изменить профиль
      operationId: patch_me
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
    delete:
      tags:
      - Profile
      summary: Удалить аккаунт и данные
      operationId: delete_me
      description: 'Запускает удаление персональных данных и транскриптов. Обезличенная статистика сохраняется.


        Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            Location:
              schema:
                type: string
              description: URL задачи /jobs/{id}
            Retry-After:
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/consents:
    get:
      tags:
      - Profile
      summary: Мои согласия
      operationId: get_me_consents
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/consents/{kind}:
    put:
      tags:
      - Profile
      summary: Дать или отозвать согласие
      operationId: put_me_consents_kind
      description: 'Без согласия transcript_processing сессии создавать нельзя (409 consent_required).


        Роли: any.'
      x-roles:
      - any
      x-status: planned
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentIn'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /me/progress:
    get:
      tags:
      - Profile
      summary: Мой прогресс по навыкам
      operationId: get_me_progress
      description: 'Роли: student.'
      x-roles:
      - student
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
  /me/subscription:
    get:
      tags:
      - Profile
      summary: Моя подписка
      operationId: get_me_subscription
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /me/data-export:
    post:
      tags:
      - Profile
      summary: Выгрузить мои данные
      operationId: post_me_data_export
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            Location:
              schema:
                type: string
              description: URL задачи /jobs/{id}
            Retry-After:
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /organizations/{orgId}:
    get:
      tags:
      - Organizations
      summary: Организация
      operationId: get_organizations_orgId
      description: 'Роли: teacher, org_admin.'
      x-roles:
      - teacher
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
    patch:
      tags:
      - Organizations
      summary: Изменить организацию
      operationId: patch_organizations_orgId
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /organizations/{orgId}/members:
    get:
      tags:
      - Organizations
      summary: Участники организации
      operationId: get_organizations_orgId_members
      description: 'Роли: teacher, org_admin.'
      x-roles:
      - teacher
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Размер страницы
      - name: cursor
        in: query
        schema:
          type: string
        description: Курсор из next_cursor предыдущей страницы
      - name: role
        in: query
        schema:
          type: string
          enum:
          - student
          - teacher
          - org_admin
        description: Фильтр по роли
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  next_cursor:
                    oneOf:
                    - type: string
                    - type: 'null'
                required:
                - items
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /organizations/{orgId}/invitations:
    post:
      tags:
      - Organizations
      summary: Пригласить пользователя
      operationId: post_organizations_orgId_invitations
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationIn'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /organizations/{orgId}/members/{userId}:
    patch:
      tags:
      - Organizations
      summary: Изменить роль участника
      operationId: patch_organizations_orgId_members_userId
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
    delete:
      tags:
      - Organizations
      summary: Исключить участника
      operationId: delete_organizations_orgId_members_userId
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Без содержимого
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /organizations/{orgId}/subscription:
    get:
      tags:
      - Organizations
      summary: Лицензия организации
      operationId: get_organizations_orgId_subscription
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /groups:
    get:
      tags:
      - Organizations
      summary: Группы (мои или организации)
      operationId: get_groups
      description: 'Роли: teacher, org_admin, student.'
      x-roles:
      - teacher
      - org_admin
      - student
      x-status: planned
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Размер страницы
      - name: cursor
        in: query
        schema:
          type: string
        description: Курсор из next_cursor предыдущей страницы
      - name: org_id
        in: query
        schema:
          type: string
          format: uuid
        description: Фильтр по организации
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  next_cursor:
                    oneOf:
                    - type: string
                    - type: 'null'
                required:
                - items
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
    post:
      tags:
      - Organizations
      summary: Создать группу
      operationId: post_groups
      description: 'Роли: teacher, org_admin.'
      x-roles:
      - teacher
      - org_admin
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupIn'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /groups/{groupId}:
    get:
      tags:
      - Organizations
      summary: Группа
      operationId: get_groups_groupId
      description: 'Роли: teacher, org_admin, student.'
      x-roles:
      - teacher
      - org_admin
      - student
      x-status: planned
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
    patch:
      tags:
      - Organizations
      summary: Изменить группу
      operationId: patch_groups_groupId
      description: 'Роли: teacher, org_admin.'
      x-roles:
      - teacher
      - org_admin
      x-status: planned
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
    delete:
      tags:
      - Organizations
      summary: Удалить группу
      operationId: delete_groups_groupId
      description: 'Роли: org_admin.'
      x-roles:
      - org_admin
      x-status: planned
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Без содержимого
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /groups/{groupId}/members:
    get:
      tags:
      - Organizations
      summary: Состав группы
