      tags:
      - Safety
      summary: Принять или закрыть событие
      operationId: patch_safety_events_eventId
      description: 'Роли: teacher, org_admin.'
      x-roles:
      - teacher
      - org_admin
      x-status: planned
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyEventPatch'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyEvent'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /billing/checkout:
    post:
      tags:
      - Billing
      summary: Создать платёжную сессию
      operationId: post_billing_checkout
      description: 'Роли: any.'
      x-roles:
      - any
      x-status: planned
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Повтор запроса с тем же ключом в течение 24 ч возвращает первый результат.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIn'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOut'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /webhooks/payments/{provider}:
    post:
      tags:
      - Billing
      summary: Вебхук платёжного провайдера
      operationId: post_webhooks_payments_provider
      description: 'Подпись проверяется по секрету провайдера (HMAC), повторы безопасны (идемпотентность по event
        id).


        Роли: public.'
      x-roles:
      - public
      x-status: planned
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Без содержимого
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /admin/prompt-templates:
    get:
      tags:
      - Admin
      summary: Шаблоны промптов
      operationId: get_admin_prompt_templates
      description: 'Роли: platform_admin.'
      x-roles:
      - platform_admin
      x-status: planned
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Размер страницы
      - name: cursor
        in: query
        schema:
          type: string
        description: Курсор из next_cursor предыдущей страницы
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - patient
          - classifier
          - judge
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PromptTemplate'
                  next_cursor:
                    oneOf:
                    - type: string
                    - type: 'null'
                required:
                - items
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
    post:
      tags:
      - Admin
      summary: Создать версию шаблона
      operationId: post_admin_prompt_templates
      description: 'Роли: platform_admin.'
      x-roles:
      - platform_admin
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateIn'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplate'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /admin/prompt-templates/{templateId}/activate:
    post:
      tags:
      - Admin
      summary: Сделать версию активной
      operationId: post_admin_prompt_templates_templateId_activate
      description: 'Роли: platform_admin.'
      x-roles:
      - platform_admin
      x-status: planned
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplate'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /admin/llm-usage:
    get:
      tags:
      - Admin
      summary: 'Расход LLM: вызовы, токены, задержка, стоимость'
      operationId: get_admin_llm_usage
      description: 'Роли: platform_admin.'
      x-roles:
      - platform_admin
      x-status: planned
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmUsage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
  /health:
    get:
      tags:
      - System
      summary: Liveness
      operationId: get_health
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /ready:
    get:
      tags:
      - System
      summary: 'Readiness: БД, Redis, LLM'
      operationId: get_ready
      description: 'Роли: public.'
      x-roles:
      - public
      x-status: planned
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/E429'
        '503':
          $ref: '#/components/responses/E503'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Машиночитаемый код ошибки. 400 bad_request; 401 unauthorized, token_expired; 403 forbidden,
            state_hidden; 404 not_found; 409 consent_required, session_not_active, session_not_ended, session_busy,
            version_immutable, version_not_published, case_has_sessions, group_has_sessions, previous_session_mismatch,
            duplicate_message, already_exists, last_admin, teacher_has_groups; 412 precondition_failed; 422 validation_failed,
            format_not_supported; 429 rate_limited; 502 llm_unavailable, sso_failed; 503 not_ready
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    PatientState:
      type: object
      properties:
        trust:
          type: number
          minimum: 0
          maximum: 1
        anxiety:
          type: number
          minimum: 0
          maximum: 1
        resistance:
          type: number
          minimum: 0
          maximum: 1
        openness:
          type: number
          minimum: 0
          maximum: 1
      required:
      - trust
      - anxiety
      - resistance
      - openness
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - assessment
          - data_export
          - erasure
          - report
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        result_url:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
        error:
          oneOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - type
      - status
      - created_at
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum:
          - student
          - teacher
          - org_admin
          - platform_admin
        org_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        locale:
          type: string
          examples:
          - ru
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - created_at
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
      required:
      - access_token
      - token_type
      - expires_in
      description: 'Refresh-токен выдаётся отдельно: httpOnly-cookie psy_refresh, ротируется при каждом /auth/refresh.'
    RegisterIn:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        full_name:
          type: string
        locale:
          type: string
        invitation_token:
          oneOf:
          - type: string
            description: 'Токен из письма-приглашения: привязывает к организации и роли'
          - type: 'null'
      required:
      - email
      - password
      - full_name
    LoginIn:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    PasswordForgotIn:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetIn:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 10
      required:
      - token
      - new_password
    UserPatch:
      type: object
      properties:
        full_name:
          type: string
        locale:
          type: string
    Consent:
      type: object
      properties:
        kind:
          type: string
          enum:
          - transcript_processing
          - analytics
          - research_use
        granted:
          type: boolean
        granted_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - kind
      - granted
    ConsentIn:
      type: object
      properties:
        granted:
          type: boolean
      required:
      - granted
    Progress:
      type: object
      properties:
        sessions_completed:
          type: integer
        avg_total_score:
          oneOf:
          - type: number
          - type: 'null'
        skills:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              title:
                type: string
              avg_score:
                type: number
              delta_30d:
                oneOf:
                - type: number
                - type: 'null'
      required:
      - sessions_completed
      - skills
    Subscription:
      type: object
      properties:
        owner_type:
          type: string
          enum:
          - user
          - organization
        plan:
          type: string
        status:
          type: string
          enum:
          - active
          - past_due
          - canceled
          - trial
        valid_until:
          oneOf:
          - type: string
            format: date
          - type: 'null'
      required:
      - owner_type
      - plan
      - status
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        org_type:
          type: string
          enum:
          - university
          - clinic
          - training_center
        data_region:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - org_type
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
    Member:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - student
          - teacher
          - org_admin
        joined_at:
          type: string
          format: date-time
      required:
      - user_id
      - role
    MemberPatch:
      type: object
      properties:
        role:
          type: string
          enum:
          - student
          - teacher
          - org_admin
      required:
      - role
    InvitationIn:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - student
          - teacher
        group_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - email
      - role
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
          enum:
          - pending
          - accepted
          - expired
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - status
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
        members_count:
          type: integer
      required:
      - id
      - org_id
      - teacher_id
      - name
    GroupIn:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - org_id
      - name
    GroupPatch:
      type: object
      properties:
        name:
          type: string
        teacher_id:
          type: string
          format: uuid
    Disorder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        classifier:
          type: string
          enum:
          - ICD-11
          - DSM-5
        code:
          type: string
        name:
          type: string
      required:
      - id
      - classifier
      - code
      - name
    Trigger:
      type: object
      properties:
        id:
          type: string
        keywords:
          type: array
          items:
            type: string
        situation:
          type: string
        automatic_thought:
          type: string
        emotion:
          type: string
        behavior:
          type: string
        intensity:
          type: number
          minimum: 0
          maximum: 1
      required:
      - id
      - keywords
      - situation
      - automatic_thought
      - emotion
      - behavior
    CaseModel:
      type: object
      properties:
        title:
          type: string
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        occupation:
          type: string
        language:
          type: string
        presenting_problem:
          type: string
        background:
          type: array
          items:
            type: string
        core_beliefs:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            type: string
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
        defenses:
          type: array
          items:
            type: string
        communication_style:
          type: object
          properties:
            verbosity:
              type: string
              enum:
              - terse
              - moderate
              - talkative
            tone:
              type: string
            quirks:
              type: array
              items:
                type: string
        goals:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        disorders:
          type: array
          items:
            type: object
            properties:
              classifier:
                type: string
                enum:
                - ICD-11
                - DSM-5
              code:
                type: string
              name:
                type: string
              role:
                type: string
                enum:
                - primary
                - comorbid
            required:
            - classifier
            - code
            - name
        baseline:
          $ref: '#/components/schemas/PatientState'
        hidden_disclosure:
          oneOf:
          - type: object
            properties:
              text:
                type: string
              trust_threshold:
                type: number
                minimum: 0
                maximum: 1
              openness_threshold:
                type: number
                minimum: 0
                maximum: 1
            required:
            - text
          - type: 'null'
      required:
      - title
      - name
      - age
      - gender
      - presenting_problem
      - background
      - core_beliefs
      - rules
      - triggers
      - defenses
      - communication_style
      - goals
      - strengths
      - disorders
      - baseline
      description: Совпадает с pydantic-схемой CaseModel модуля case_model.
    CaseModelPublic:
      type: object
      properties:
        title:
          type: string
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        occupation:
          type: string
        language:
          type: string
        presenting_problem:
          type: string
      description: 'Что видит студент: только то, что видит человек на приёме. Структура случая скрыта.'
    CaseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        visibility:
          type: string
          enum:
          - private
          - org
          - public
        author_id:
          type: string
          format: uuid
        org_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        latest_version_no:
          type: integer
        published_version_no:
          oneOf:
          - type: integer
          - type: 'null'
        archived:
          type: boolean
        disorders:
          type: array
          items:
            $ref: '#/components/schemas/Disorder'
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - visibility
      - author_id
      - latest_version_no
      - archived
    VersionInfo:
      type: object
      properties:
        version_no:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
        created_at:
          type: string
          format: date-time
        published_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - version_no
      - status
    CaseDetail:
      allOf:
      - $ref: '#/components/schemas/CaseSummary'
      - type: object
        properties:
          versions:
            type: array
            items:
              $ref: '#/components/schemas/VersionInfo'
    CaseVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        version_no:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
        case_model:
          oneOf:
          - $ref: '#/components/schemas/CaseModel'
          - $ref: '#/components/schemas/CaseModelPublic'
        language:
          type: string
        created_at:
          type: string
          format: date-time
        published_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - case_id
      - version_no
      - status
      - case_model
    CaseIn:
      type: object
      properties:
        title:
          type: string
        visibility:
          type: string
          enum:
          - private
          - org
          - public
        case_model:
          $ref: '#/components/schemas/CaseModel'
      required:
      - title
      - case_model
    CasePatch:
      type: object
      properties:
        title:
          type: string
        visibility:
          type: string
          enum:
          - private
          - org
          - public
        archived:
          type: boolean
    VersionCreateIn:
      type: object
      properties:
        based_on_version_no:
          type: integer
      description: Создаёт новый черновик на основе версии (по умолчанию последней).
    ValidationReport:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - valid
      - errors
      - warnings
      description: 'errors блокируют публикацию, warnings нет (например: корень ключевого слова короче 4 символов,
        нет триггеров, порог тайны выше 0.9).'
    SuggestionIn:
      type: object
      properties:
        section:
          type: string
          enum:
          - background
          - core_beliefs
          - rules
          - triggers
          - defenses
          - communication_style
          - hidden_disclosure
        context:
          type: object
          properties: {}
          description: Уже заполненные части CaseModel
        language:
          type: string
      required:
      - section
      - context
    SuggestionOut:
      type: object
      properties:
        section:
          type: string
        suggestions:
          type: array
          items:
            type: object
            properties:
              value: {}
              rationale:
                type: string
            required:
            - value
      required:
      - section
      - suggestions
    SessionIn:
      type: object
      properties:
        case_version_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
          description: 'Вместо case_version_id: берётся последняя опубликованная версия'
        prev_session_id:
          oneOf:
          - type: string
            format: uuid
